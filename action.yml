name: 'APIVerve Domain Health'
description: 'Monitor domain expiration, WHOIS changes, and domain availability'
author: 'APIVerve'
branding:
  icon: 'shield'
  color: 'yellow'

inputs:
  api_key:
    description: 'Your APIVerve API key. Can also be set via APIVERVE_API_KEY env var.'
    required: false
  api:
    description: 'The API to use. Options: domainexpiration, whoislookup, domainavailability, pinger'
    required: false
    default: 'domainexpiration'
  params:
    description: 'JSON parameters to pass to the API'
    required: false
    default: '{}'
  output_file:
    description: 'Path to save binary output (for APIs that return files like images, PDFs)'
    required: false
  format:
    description: 'Response format: json, yaml, or xml'
    required: false
    default: 'json'
  check:
    description: 'Run a pass/fail check instead of a plain API call. Options: domain-expiry'
    required: false
    default: ''
  domain:
    description: 'Domain to check (used with check)'
    required: false
  warn_days:
    description: 'Warn when fewer than this many days remain (default 30 for ssl-expiry, 60 for domain-expiry)'
    required: false
  fail_days:
    description: 'Fail when fewer than this many days remain (default 7 for ssl-expiry, 14 for domain-expiry)'
    required: false
  fail_on_error:
    description: 'Whether to fail the workflow if the API returns an error'
    required: false
    default: 'true'

outputs:
  result:
    description: 'The full API response as JSON'
  data:
    description: 'The data field from the API response as JSON'
  status:
    description: 'The status of the API call (ok or error)'
  file:
    description: 'Path to the downloaded file (if output_file was specified)'
  days_remaining:
    description: 'Days until expiry (ssl-expiry, domain-expiry)'
  records:
    description: 'Matching DNS records as JSON (dns-record)'

runs:
  using: 'node24'
  main: 'dist/index.js'
